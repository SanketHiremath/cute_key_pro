# Battery level reporting over BLE (shows % in OS)
CONFIG_ZMK_BATTERY_REPORTING=y

# Bluetooth
CONFIG_ZMK_BLE=y

# ZMK Studio – allows live keymap editing via the Studio app over USB
CONFIG_ZMK_STUDIO=y

# Power management – idle after 15 min, deep sleep after 30 min
CONFIG_ZMK_IDLE_TIMEOUT=900000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
